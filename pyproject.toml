[project]
name = "quant-job-agent"
version = "0.1.0"
description = "Autonomous Job Search and Application Agent for Quant Finance and Tech"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "google-genai>=0.2.0",
    "pypdf>=5.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

